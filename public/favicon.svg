<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Das Radar-Signet der Seite, siehe src/components/RadarMark.tsx.
       Bewusst nicht das IWI-Logo: das Favicon kennzeichnet diese Seite, und die
       HSG-Wortmarke waere bei 16 Pixeln ohnehin nicht lesbar. Weisses Signet auf
       dem Gruen der HSG, damit es auf hellen wie dunklen Browserleisten steht. -->
  <rect width="32" height="32" rx="7" fill="#00802f"/>
  <circle cx="16" cy="16" r="10.5" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5"/>
  <circle cx="16" cy="16" r="6" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.5"/>
  <circle cx="16" cy="16" r="2.6" fill="#ffffff"/>
  <line x1="16" y1="16" x2="16" y2="4.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
</svg>
